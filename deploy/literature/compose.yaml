services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: matagent-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MATAGENT_POSTGRES_USER:-matagent}
      POSTGRES_PASSWORD: ${MATAGENT_POSTGRES_PASSWORD:?set MATAGENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MATAGENT_POSTGRES_DB:-matagent}
    ports:
      - "127.0.0.1:${MATAGENT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - matagent_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  matagent_pgvector_data:
