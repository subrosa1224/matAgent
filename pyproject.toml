[project]
name = "materials-screening-core"
version = "0.1.0"
description = "Deterministic inorganic semiconductor screening core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mp-api>=0.46,<0.47",
    "pymatgen>=2026.5",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "pandas>=2.2,<3",
    "typer>=0.16,<1",
    "rich>=14,<15",
    "tenacity>=9,<10",
    "orjson>=3.10,<4",
    "python-dotenv>=1,<2",
    "openai>=2,<3",
]

[project.scripts]
materials-screen = "materials_screening.cli:main"

[project.optional-dependencies]
workflow = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite",
]
web-ui = [
    "gradio>=6,<7",
]
literature = [
    "PyMuPDF>=1.24,<2",
    "psycopg[binary]>=3.2,<4",
]
rag = [
    "sentence-transformers>=3,<6",
    "FlagEmbedding>=1.4,<2",
    # FlagReranker still calls tokenizer.prepare_for_model, which was moved
    # off the base tokenizer API in Transformers 5.
    "transformers>=4.44,<5",
]
analysis = [
    "scipy>=1.15,<2",
    "matplotlib>=3.10,<4",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/materials_screening"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_api: tests that call the live Materials Project API",
    "real_llm: tests that call a live LLM provider",
    "real_llm: tests that call the live Intern API",
    "real_agent: tests that call a live agent model",
]
